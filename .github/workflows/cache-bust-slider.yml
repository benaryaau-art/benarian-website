name: One-shot slider cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-slider.yml'

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust mobile slider stylesheet cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/tour-splash-simple.css?v=20260809-clean2s'
          new = 'assets/tour-splash-simple.css?v=20260811-luxslider-v2'
          if old not in s:
              raise SystemExit('Expected stylesheet reference not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit cache-busting reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bust mobile slider CSS cache"
          git push
