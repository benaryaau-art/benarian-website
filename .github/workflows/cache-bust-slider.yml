name: Slider cache bust

on:
  push:
    branches: [main]
    paths:
      - 'assets/tour-splash-simple.css'

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh slider stylesheet version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, time
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          stamp = int(time.time())
          new = f'assets/tour-splash-simple.css?v={stamp}'
          s2, n = re.subn(r'assets/tour-splash-simple\.css\?v=[^"\']+', new, s, count=1)
          if n != 1:
              raise SystemExit('Stylesheet reference not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit cache-busting reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh slider CSS cache key"
          git push
