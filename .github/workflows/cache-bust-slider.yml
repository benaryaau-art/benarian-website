name: Slider cache bust

on:
  push:
    branches: [main]
    paths:
      - 'assets/tour-splash-simple.css'

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh slider stylesheet version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, time
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          stamp = int(time.time())
          new = f'assets/tour-splash-simple.css?v={stamp}'
          s2, n = re.subn(r'assets/tour-splash-simple\.css\?v=[^"\']+', new, s, count=1)
          if n != 1:
              raise SystemExit('Stylesheet reference not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit cache-busting reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Cache key is already current"
            exit 0
          fi
          git commit -m "Refresh slider CSS cache key"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; retrying ($attempt/3)"
            sleep $((attempt * 2))
          done
          echo "Unable to push cache key after 3 attempts"
          exit 1
